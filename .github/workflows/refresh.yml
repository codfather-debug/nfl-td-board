name: Refresh from sheet

on:
  schedule:
    # Every day at 15:00 UTC, after the sheet's 6, 7 and 8am Central jobs. Nothing is published unless data changed.
    - cron: "0 15 * * *"
    # Closer to kickoff on game days, so recorded plays reflect late injury news.
    - cron: "0 16 * * 0,6"
    - cron: "0 21 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

# Two refreshes at once would both try to publish; let the first finish.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      # The page is only published if build.py and the page agree on every player's chance.
      - run: python -m unittest discover tests
      - name: Publish if changed
        run: |
          git add index.html results
          if git diff --cached --quiet; then
            echo "Sheet unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh data and results"
            git pull --rebase
            git push
          fi
