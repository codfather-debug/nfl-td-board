<script>
let D = /*__DATA__*/null;
const SAVED_KEY = "first-td-board-data";
const refreshedAt = d => new Date(d.refreshed).getTime() || 0;
try {
  const saved = JSON.parse(localStorage.getItem(SAVED_KEY));
  if (saved && refreshedAt(saved) >= refreshedAt(D)) {
    const newerInjuries = (saved.injuriesAt || "") > (D.injuriesAt || "") ? saved : D;
    D = { ...saved, season: D.season, results: D.results, recent: D.recent, qbPrev: D.qbPrev, model: D.model, lines: newerInjuries.lines, injuries: newerInjuries.injuries, injuriesAt: newerInjuries.injuriesAt };
  } else localStorage.removeItem(SAVED_KEY);
} catch (e) { /* Storage is optional; the data built into the page still works. */ }

/* ---- Player scoring: model.json holds the fitted model. build.py repeats this section; tests/test_build.py checks they agree. ---- */
const UNAVAILABLE = { "Out": "out", "Doubtful": "doubtful", "Injured Reserve": "on injured reserve", "Suspension": "suspended" };
const POS = ["RB", "WR", "TE", "QB"];
const LEAGUE_AVG_POINTS = 23, TEAM_FIRST_CAP = 0.9;
function normName(name) { // Keep in step with norm_name in build.py.
  return name.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[.'’\-]/g, "")
    .trim().replace(/\s+(jr|sr|ii|iii|iv|v)$/, "").replace(/\s+/g, " ");
}
const injuryStatus = (team, player) => (D.injuries || {})[`${team}|${normName(player || "")}`] || "";
const sigmoid = x => 1 / (1 + Math.exp(-x));
function calibrate(curve, p) { // The model's raw number, turned into how often it came true out of sample.
  const { x, y } = curve;
  if (p <= x[0]) return y[0];
  for (let i = 1; i < x.length; i++) if (p <= x[i]) return y[i - 1] + (y[i] - y[i - 1]) * (p - x[i - 1]) / (x[i] - x[i - 1]);
  return y[y.length - 1];
}
function modelInputs(u, x, imp, missrz) {
  const prior = D.model.qbPrior, [games, scored] = (D.qbPrev || {})[normName(u.player)] || [0, 0]; // A quarterback's games last season and the games he scored in.
  const base = { qbprev: (u.pos === "QB") * (scored + prior.weight * prior.avg) / (games + prior.weight), oppg: ((u.targets || 0) + (u.carries || 0)) / x.gp, rzsh: u.rz_opp_share || 0, i10sh: u.i10_opp_share || 0, snaplast: x.lastPlayed || 0, imp, missrz };
  POS.forEach(p => { base["is" + p] = +(u.pos === p); });
  return Object.fromEntries(D.model.features.map(f => [f, f.startsWith("sqrt_") ? Math.sqrt(Math.max(base[f.slice(5)], 0)) : base[f]]));
}
const rawChance = (c, f) => sigmoid(c.intercept + D.model.features.reduce((a, k) => a + c[k] * f[k], 0));
function fairOdds(p) { // The American odds at which a bet with this chance breaks even.
  if (!(p > 0 && p < 1)) return null;
  return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p);
}
function kickoffIso(day, time) { // Eastern time, which is 4 hours behind UTC during daylight saving and 5 otherwise.
  const [y, m, d] = day.split("-").map(Number);
  const sunday = (month, n) => 1 + (7 - new Date(Date.UTC(y, month - 1, 1)).getUTCDay()) % 7 + 7 * (n - 1);
  const daylight = (m > 3 || (m === 3 && d >= sunday(3, 2))) && (m < 11 || (m === 11 && d < sunday(11, 1)));
  return `${day}T${time}:00${daylight ? "-04:00" : "-05:00"}`;
}
const hasStarted = line => !!line && (line.final || Date.now() >= new Date(line.kickoff).getTime());
function starterScore(rz, x, first) { // Keep in step with starter_score in build.py.
  return (rz + 2 * x.tds + 3 * first) / x.gp * (0.6 * (x.lastPlayed || 0) + 0.4 * (x.avgSnap || 0));
}
function choosePick(sheetPlayer, position, teamPlayers) { // Keep in step with choose_pick in build.py.
  const atPosition = teamPlayers.filter(p => p.pos === position);
  const available = atPosition.filter(p => !p.unavailable).sort((a, b) => b.starter - a.starter);
  if (!available.length) return null;
  const best = available[0], sheet = atPosition.find(p => p.player === sheetPlayer);
  if (!sheet || sheet.unavailable) return best;
  const clear = best !== sheet && best.starter >= 1.25 * sheet.starter && best.lastPlayed >= sheet.lastPlayed + 0.10 && best.rzPerGame >= sheet.rzPerGame;
  return clear ? best : sheet;
}
function scorePlayers() { // Keep in step with score_players in build.py.
  const firsts = {};
  D.log.forEach(l => { if (l["Team 1st TD Scorer"]) { const k = l.Team + "|" + l["Team 1st TD Scorer"]; firsts[k] = (firsts[k] || 0) + 1; } });
  const lines = D.lines || {}, rows = {}, model = D.model && D.model.anyCal ? D.model : null;
  D.slate.forEach(r => { rows[r.team] = r; });
  D.players = [];

/* ---- Results: recorded before kickoff, graded after the game. ---- */
function record(rows, field, rateField) { // Hits, what the app expected, and the range luck alone would give.
  const hits = rows.filter(e => e[field] === true).length, known = rateField && rows.every(e => typeof e[rateField] === "number");
  const expected = known ? rows.reduce((a, e) => a + e[rateField], 0) : null;
  const spread = known ? 2 * Math.sqrt(rows.reduce((a, e) => a + e[rateField] * (1 - e[rateField]), 0)) : null;
  return { n: rows.length, hits, rate: rows.length ? hits / rows.length : null, expected,
    low: known ? Math.max(0, Math.round(expected - spread)) : null, high: known ? Math.min(rows.length, Math.round(expected + spread)) : null };
}
const recordText = r => r.n ? `${r.hits} of ${r.n} (${pctText(r.rate)})` : "No results yet";
const expectedText = r => !r.n || r.expected == null ? "–" : `${r.expected.toFixed(1)} (${pctText(r.expected / r.n)})`;
const rangeText = r => !r.n || r.low == null ? "–" : r.hits < r.low ? `Below the normal range of ${r.low} to ${r.high}` : r.hits > r.high ? `Above the normal range of ${r.low} to ${r.high}` : `Within the normal range of ${r.low} to ${r.high}`;
function testedTable(title, t, label) {
  if (!t) return "";
  const names = t.bands.map((b, i) => i === t.bands.length - 1 ? `${Math.round(b.min * 100)}% or better` : `${Math.round(b.min * 100)} to ${Math.round(t.bands[i + 1].min * 100)}%`);
  return `<div><div class="mix-label">${title}</div><div class="tablebox"><table class="mini results"><thead><tr><th>App said</th><th>Average shown</th><th>${label}</th><th>Player games</th></tr></thead><tbody>
    ${t.bands.map((b, i) => `<tr><td>${names[i]}</td><td>${(b.predicted * 100).toFixed(1)}%</td><td><b>${(b.actual * 100).toFixed(1)}%</b></td><td>${b.n.toLocaleString()}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function viewResults() {
  const all = (D.results || {}).plays || [], held = D.model.heldOut || {};
  const intro = `<div><h2>Results</h2><p class="hint">How the app's plays did. Each play is recorded before its game kicks off and graded after the final. A few weeks is a small sample, so a good or bad run can be luck: the normal range shows how far luck alone would move the count.</p>
    ${how("Plays have been recorded since the last game of Week 8. Players who didn't play are left out of hit rates and listed separately. Through Week 9 the app showed rounded tiers; from Week 10 it shows each player's own chance, so earlier rows carry the tier that was shown at the time. The normal range is where the count would land about 19 times in 20 if every chance shown were exactly right.")}</div>`;
  const tested = `<section class="stack" style="gap:10px"><div><h3>How the model tested before going live</h3>
    <p class="hint">Each season was scored by a model built only from the other seasons (${esc(D.model.sample.seasons)}; ${D.model.sample.playerGames.toLocaleString()} player games). If the two middle columns match, the chance shown can be trusted.</p></div>
    <div class="vs">${testedTable("Any TD", held.any, "Actually scored")}${testedTable("Team's first TD", held.first, "Actually scored first")}</div></section>`;
  if (!all.length) return intro + `<div class="empty">No plays recorded yet. They appear here before the next kickoff.</div>` + tested;
  const graded = all.filter(e => e.isPlay && e.anyTd !== undefined && e.played);
  const bands = BANDS.map(b => b[1]).filter(b => graded.some(e => bandOf(e.anyRate) === b));
  const firsts = field => { const rows = all.filter(e => e[field] && e.teamFirst !== undefined && e.played !== false); return { team: record(rows, "teamFirst", "firstRate"), game: record(rows, "gameFirst", "gameRate"), any: record(rows.filter(e => e.anyTd !== undefined), "anyTd") }; };
  const app = firsts("isPick"), sheet = firsts("isSheet"), total = record(graded, "anyTd", "anyRate");
  const pending = all.filter(e => (e.isPlay || e.isPick) && e.anyTd === undefined).length;
  const dnp = all.filter(e => e.isPlay && e.played === false).length;
  const weeks = [...new Set(all.map(e => e.week))].sort((a, b) => b - a);
  const shown = all.filter(e => (e.isPlay || e.isPick) && (state.resultsWeek === "All" || String(e.week) === state.resultsWeek))
    .sort((a, b) => b.week - a.week || (b.anyRate || 0) - (a.anyRate || 0));
  const mark = v => v === true ? '<span class="pos">Yes</span>' : v === false ? "No" : "Pending";
  const row = (name, r) => `<tr><td>${name}</td><td>${r.n}</td><td>${expectedText(r)}</td><td><b>${r.n ? `${r.hits} (${pctText(r.rate)})` : "–"}</b></td><td class="note">${rangeText(r)}</td></tr>`;
  return intro + `<section class="stack" style="gap:10px"><h3>Any TD plays: expected vs. actual</h3>
    <div class="tablebox"><table class="mini results"><thead><tr><th>Chance shown</th><th>Plays</th><th>Expected to score</th><th>Scored</th><th>Luck check</th></tr></thead><tbody>
      ${bands.map(b => row(b, record(graded.filter(e => bandOf(e.anyRate) === b), "anyTd", "anyRate"))).join("")}
      ${row("<b>All plays</b>", total)}
    </tbody></table></div>
    <p class="hint">${pending} plays waiting on a result. ${dnp} recorded players didn't play.</p></section>
  <section class="stack" style="gap:10px"><h3>First TD picks: app vs. your sheet</h3>
    <div class="tablebox"><table class="mini results"><thead><tr><th>Pick came from</th><th>Team's 1st TD</th><th>Expected</th><th>Game's 1st TD</th><th>Any TD</th></tr></thead><tbody>
      <tr><td>App</td><td><b>${recordText(app.team)}</b></td><td>${expectedText(app.team)}</td><td>${recordText(app.game)}</td><td>${recordText(app.any)}</td></tr>
      <tr><td>Your sheet</td><td><b>${recordText(sheet.team)}</b></td><td>–</td><td>${recordText(sheet.game)}</td><td>${recordText(sheet.any)}</td></tr>
    </tbody></table></div></section>
  ${tested}
  <section class="stack" style="gap:10px"><div class="filters"><h3>Every recorded play</h3>
    <select id="results-week" aria-label="Week"><option value="All">All weeks</option>${weeks.map(w => `<option value="${w}" ${String(w) === state.resultsWeek ? "selected" : ""}>Week ${w}</option>`).join("")}</select></div>
    <div class="tablebox"><table class="data"><thead><tr><th class="t"><span>Wk</span></th><th class="t"><span>Player</span></th><th class="t"><span>Game</span></th><th><span>Any TD chance</span></th><th><span>Scored TD</span></th><th><span>Team's 1st</span></th><th><span>Game's 1st</span></th></tr></thead><tbody>
      ${shown.map(e => `<tr><td class="t">${e.week}</td><td class="t" style="font-weight:600">${esc(e.player)} <span class="chip ${esc(e.pos)}">${esc(e.pos)}</span>${e.isPick ? '<span class="flag">1st TD pick</span>' : ""}${e.played === false ? '<span class="flag bad">Didn’t play</span>' : ""}</td><td class="t">${esc(e.team)} ${esc(e.opp)}</td><td>${pctText(e.anyRate)}</td><td>${e.played === false ? "–" : mark(e.anyTd)}</td><td>${e.played === false ? "–" : mark(e.teamFirst)}</td><td>${e.played === false ? "–" : mark(e.gameFirst)}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

$("#view").addEventListener("click", e => {
  const b = e.target.closest("button, tr[data-defopen]"); if (!b) return;
  const d = b.dataset;
  if (d.game) return go("matchups", { game: d.game });
  if (d.open) { state.open = state.open === d.open ? null : d.open; return render(); }
  if ("playstarted" in d) { state.plays.started = !state.plays.started; return render(); }
  if (d.seg) {
    const v = d.val;
    if (d.seg === "day") state.day = v; else if (d.seg === "pos") state.pos = v;
    else if (d.seg === "playpos") state.plays.pos = v; else if (d.seg === "playday") state.plays.day = v;
    else if (d.seg === "plypos") state.ply.pos = v; else if (d.seg === "logpos") state.log.pos = v;
    else if (d.seg === "logside") state.log.side = v === "Scored" ? "team" : "allowed";
    return render();
  }
  if (d.defsort) { const s = state.def; if (s.key === d.defsort) s.dir *= -1; else { s.key = d.defsort; s.dir = -1; } return render(); }
  if (d.defopen) { state.def.open = state.def.open === d.defopen ? null : d.defopen; return render(); }
  if (d.plysort) { const s = state.ply; if (s.key === d.plysort) s.dir *= -1; else { s.key = d.plysort; s.dir = -1; } return fillPlayers(); }
});
$("#view").addEventListener("keydown", e => {
  const tr = e.target.closest && e.target.closest("tr[data-defopen]");

$("#view").addEventListener("change", e => {

    const text = e.target.value.trim(), out = e.target.nextElementSibling;
    if (text) prices[key] = text; else delete prices[key];
    [out.textContent, out.className] = verdict(+e.target.dataset.p, text);

  }

function parseWorkbook(buffer) {
  const wb = XLSX.read(buffer, { type: "array" });
  const clean = v => typeof v === "number" ? (Number.isInteger(v) ? v : Math.round(v * 1000) / 1000)
    : typeof v === "string" ? v.trim() : v ?? null;
  const rawRows = name => {
    if (!wb.Sheets[name]) throw new Error(`The sheet has no "${name}" tab.`);
    return XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
  };
  const rows = name => rawRows(name).map(r => r.map(clean));
  const zip = (keys, vals) => Object.fromEntries(keys.map((k, i) => [k, vals[i] ?? null]).filter(([k]) => k));
  const table = name => {
    const [head, ...rest] = rows(name);
    return rest.filter(r => r[0] !== null && r[0] !== "").map(r => zip(head, r));
  };
  const headerAt = (all, first) => all.findIndex(r => r[0] === first);
  const timeText = v => {
    if (typeof v !== "number") return v;
    const m = Math.round(v * 1440), h = Math.floor(m / 60);
    return `${h % 12 || 12}:${String(m % 60).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
  };

  const picks = rows("1st TD Picks");
  const topAt = headerAt(picks, "#"), top = [];
  for (const r of picks.slice(topAt + 1)) { if (!Number.isInteger(r[0])) break; top.push(zip(picks[topAt], r)); }
  const slateKeys = ["day", "kick", "team", "opp", "teamPos", "venuePos", "oppPos", "oppVenue", "pick", "conf", "player", "rz", "tds", "first", "alt", "gameFirst", "noTd"];
  const slate = []; let day = null, kick = null;
  for (const r of picks.slice(headerAt(picks, "Day") + 1)) {
    if (!r[2]) continue;
    day = r[0] || day; kick = r[1] || kick;
    slate.push(zip(slateKeys, [day, kick, ...r.slice(2)]));
  }
  const weekMatch = /WEEK (\d+)/.exec(picks[0][0] || "");
  if (!weekMatch) throw new Error("The 1st TD Picks tab has no week in its title.");

  const off = {}, dfn = {}, nickToAbbr = {}; let refreshed = "";
  const add = (bucket, team, pos, ru, re, pa) => {
    const t = (bucket[team] ??= {})[pos] ??= [0, 0, 0];
    t[0] += ru; t[1] += re; t[2] += pa;
  };
  for (const r of rows("POS DATA")) {
    for (const c of r) if (typeof c === "string" && c.startsWith("Last refreshed")) refreshed = c.replace("Last refreshed:", "").trim();
    if (r[9] && r[9] !== "Nick" && r[11]) nickToAbbr[r[9]] = r[11];
    if (POS.includes(r[0])) { add(off, r[1], r[0], r[5] || 0, r[6] || 0, r[4] || 0); add(dfn, r[2], r[0], r[5] || 0, r[6] || 0, r[4] || 0); }
  }

  const weekRows = rawRows("This Weeks TDs").map(r => r.map((v, i) => i === 1 ? timeText(v) : clean(v)));
  const twKeys = ["slot", "kick", "team", "opp", "pick", "lean", "teamTd", "oppTd", "top", "share", "rzShare", "i10Share", "second", "secondShare", "rzRun", "i10Run", "oppRzRun"];
  const thisWeek = []; let slot = null, twKick = null;
  for (const r of weekRows.slice(headerAt(weekRows, "Slot") + 1)) {
    if (!r[2]) continue;
    slot = r[0] || slot; twKick = r[1] || twKick;
    const rec = zip(twKeys, [slot, twKick, ...r.slice(2)]);
    rec.abbr = nickToAbbr[rec.team] || rec.team;
    thisWeek.push(rec);
  }

  const nflAvg = {};
  for (const r of rows("Matchup TDs")) {
    const vals = r.filter(v => v !== null);
    if (POS.includes(vals[0]) && !(vals[0] in nflAvg)) nflAvg[vals[0]] = vals[vals.length - 1];
  }
  const [usageHead, ...usageRows] = rows("USAGE DATA");
  const usageKeys = usageHead.slice(0, 18);
  const data = { week: +weekMatch[1], note: picks[1][0], refreshed, top, slate, thisWeek,
    allowed: table("TDs Allowed by Pos"), firstScored: table("1st TD Scored"), firstAllowed: table("1st TD Allowed"), log: table("1st TD Log"),
    usage: usageRows.filter(r => r[1]).map(r => zip(usageKeys, r)), off, dfn, nflAvg,
    nicks: Object.fromEntries(Object.entries(nickToAbbr).map(([k, v]) => [v, k])) };

  const bad = slate.length < 2 || slate.length > 32 || slate.length % 2 || !top.length || data.allowed.length !== 32
    || !data.usage.length || !data.log.length || !Object.keys(off).length
    || slate.some(r => !r.pick || !r.player || !String(r.conf).includes("%"));
  if (bad) throw new Error("The sheet looks incomplete right now, so nothing was changed.");
  return data;
}
window.parseWorkbook = parseWorkbook; window.parseLines = parseLines;
const signature = d => JSON.stringify([d.week, d.refreshed, d.log.length, d.slate.map(r => [r.team, r.pick, r.sheetPlayer || r.player, r.conf, r.sheetGameFirst || r.gameFirst]),
  d.allowed.map(r => [r.Team, r["TDs Allowed"]]), d.usage.map(r => [r.player, r.targets, r.carries]), Object.entries(d.injuries || {}).sort(), Object.entries(d.lines || {}).map(([k, v]) => [k, v.imp, v.total, v.final]).sort()]);
function parseLines(text, week) { // Keep in step with game_lines in build.py.
  const wb = XLSX.read(text, { type: "string", raw: true }), out = {};
  for (const g of XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" })) {
    if (String(g.season) !== String(D.season || 2026) || String(g.week) !== String(week) || g.spread_line === "" || g.total_line === "") continue;
    const spread = +g.spread_line, total = +g.total_line;
    const info = { total, kickoff: kickoffIso(g.gameday, g.gametime), final: g.result !== "" };
    out[g.home_team] = { ...info, margin: spread, imp: (total + spread) / 2 };
    out[g.away_team] = { ...info, margin: -spread, imp: (total - spread) / 2 };
  }
  return out;
}
function parseInjuries(json) { // Keep in step with injuries in build.py.
  const latest = {};
  for (const team of json.injuries || []) {
    const abbr = Object.keys(D.nicks).find(a => (team.displayName || "").endsWith(D.nicks[a]));
    for (const item of team.injuries || []) {
      const key = `${abbr}|${normName(item.athlete.displayName)}`;
      if (!latest[key] || (item.date || "") > latest[key][0]) latest[key] = [item.date || "", item.status];
    }
  }
  return Object.fromEntries(Object.entries(latest).filter(([, v]) => ["Active", "Out", "Doubtful", "Questionable", "Injured Reserve", "Suspension"].includes(v[1])).map(([k, v]) => [k, v[1]]));
}
$("#update-btn").onclick = async () => {
  const btn = $("#update-btn"), status = $("#update-status");
  btn.disabled = true; status.textContent = "Updating…";
  try {
    await loadXlsx();
    const resp = await fetch(EXPORT_URL);
    if (!resp.ok) throw new Error("Couldn't reach the sheet. Check that it's still shared by link, then try again.");
    const fresh = parseWorkbook(await resp.arrayBuffer());
    fresh.recent = D.recent; fresh.qbPrev = D.qbPrev; fresh.model = D.model; fresh.season = D.season; fresh.lines = D.lines; fresh.injuries = D.injuries; fresh.injuriesAt = D.injuriesAt;
    try {
      const inj = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries");
      if (inj.ok) { fresh.injuries = parseInjuries(await inj.json()); fresh.injuriesAt = new Date().toISOString(); }
    } catch (e) { /* Keep the last injury report if ESPN is down. */ }
    try {
      const lines = await fetch("https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv");
      if (lines.ok) { const parsed = parseLines(await lines.text(), fresh.week); if (Object.keys(parsed).length) fresh.lines = parsed; }
    } catch (e) { /* Keep the last lines if the source is down. */ }
    if (signature(fresh) === signature(D)) { status.textContent = `Already current: Week ${D.week}`; return; }
    localStorage.setItem(SAVED_KEY, JSON.stringify(fresh));
    location.hash = state.tab;
    location.reload();
  } catch (e) {
    status.textContent = e.name === "TypeError" ? "Couldn't reach the sheet. Check your connection and try again."
      : e.name === "QuotaExceededError" || e.name === "SecurityError" ? "This browser won't save the update. Turn off private browsing and try again."
      : e.message;
  } finally { btn.disabled = false; }
};
