<html lang="en">

<title>NFL TD Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a game-day call sheet. A compact band of tabs, then dense rows grouped by kickoff. */
:root {
  --bg: #eef2ee; --surface: #ffffff; --sunken: #e2e8e2; --fg: #14241c; --muted: #56675d; --line: #cdd7cf;
  --accent: #0f5c3f; --accent-fg: #ffffff; --band: #123a2b; --band-fg: #eaf3ec; --band-muted: #a9c5b4;
  --rb: #b5461f; --wr: #1c62a8; --te: #7a3f9d; --qb: #8a6a00; --dst: #5b6b62; --star: #a86a00;
  --good: #16764d; --bad: #b3362b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101a15; --surface: #18251e; --sunken: #0c1410; --fg: #e6efe9; --muted: #9db0a4; --line: #2c3d33;
  --accent: #5fcb9b; --accent-fg: #08140e; --band: #0b2118; --band-fg: #e6efe9; --band-muted: #8fb09d;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f; --dst: #9db0a4; --star: #f0b84a;
  --good: #5fcb9b; --bad: #f0827a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #101a15; --surface: #18251e; --sunken: #0c1410; --fg: #e6efe9; --muted: #9db0a4; --line: #2c3d33;
  --accent: #5fcb9b; --accent-fg: #08140e; --band: #0b2118; --band-fg: #e6efe9; --band-muted: #8fb09d;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f; --dst: #9db0a4; --star: #f0b84a;
  --good: #5fcb9b; --bad: #f0827a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); margin: 0; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { background: var(--band); color: var(--band-fg); padding-block: 16px 0; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font: 700 34px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand small { color: var(--band-muted); font-size: 13px; }
.updater { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 10px; }
#update-status { color: var(--band-muted); font-size: 13px; }
#update-btn { background: var(--band-fg); color: var(--band); border: 0; border-radius: 5px; cursor: pointer; font: 700 15px/1 var(--display); letter-spacing: .03em; padding: 8px 11px; text-transform: uppercase; white-space: nowrap; }
#update-btn:hover { opacity: .88; }
#update-btn:disabled { cursor: wait; opacity: .6; }
#update-btn:focus-visible { outline-color: var(--band-fg); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); border-bottom: 1px solid var(--line); }
.tabrow { display: flex; gap: 2px; overflow-x: auto; padding-top: 8px; }
.tabrow button { flex: none; background: none; border: 0; color: var(--band-muted); cursor: pointer; font: 600 18px/1 var(--display); letter-spacing: .03em; padding: 10px 14px 11px; text-transform: uppercase; border-radius: 4px 4px 0 0; }
.tabrow button:hover { color: var(--band-fg); }
.tabrow button[aria-selected="true"] { background: var(--bg); color: var(--fg); }
main { padding-block: 20px 48px; }
h2 { font: 700 24px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; text-wrap: balance; }
h3 { font: 600 17px/1.1 var(--display); letter-spacing: .03em; margin: 0; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.hint { color: var(--muted); font-size: 13.5px; max-width: 72ch; margin: 4px 0 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; padding: 5px 11px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
select, input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; min-width: 0; max-width: 100%; }
.count { color: var(--muted); font-size: 13.5px; }

.chip { display: inline-flex; align-items: center; gap: 3px; font: 700 15px/1 var(--display); letter-spacing: .04em; color: var(--c, var(--fg)); border: 1.5px solid var(--c, var(--line)); border-radius: 4px; padding: 3px 6px 2px; white-space: nowrap; }
.chip .s { color: var(--star); }
.flag { display: inline-block; font: 600 12px/1 var(--body); color: var(--accent); border: 1px solid currentColor; border-radius: 3px; padding: 2px 4px; margin-left: 3px; vertical-align: middle; white-space: nowrap; }
.flag.bad { color: var(--bad); }
.mini.results { min-width: 100%; } .mini.results td, .mini.results th { padding: 6px 10px; white-space: nowrap; }
.adjust { padding: 0 12px 9px; font-size: 13.5px; color: var(--muted); }
.RB { --c: var(--rb); } .WR { --c: var(--wr); } .TE { --c: var(--te); } .QB { --c: var(--qb); } .DST { --c: var(--dst); }

.tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 10px; }
.top-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; text-align: left; cursor: pointer; }
.top-card:hover { border-color: var(--accent); }
.top-card .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.top-card .name { font: 600 21px/1.05 var(--display); }
.top-card .l3 { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.top-card b { color: var(--fg); }
.meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }

.kick { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.kick span { color: var(--muted); font-size: 13.5px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.game + .game { margin-top: 8px; }
.pr { display: grid; grid-template-columns: 92px 74px minmax(0, 1fr) 96px 70px 44px 56px 72px 20px; gap: 10px; align-items: center; width: 100%; padding: 8px 12px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.game .pr:first-child { border-top: 0; }
.pr:hover { background: var(--sunken); }
.pr.head { cursor: default; background: var(--sunken); color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding-block: 5px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
.pr .team { font: 700 19px/1 var(--display); letter-spacing: .02em; }
.pr .team em { font: 500 14px var(--display); color: var(--muted); margin-left: 4px; font-style: normal; }
.pr .who { font-weight: 600; min-width: 0; }
.pr .num { text-align: right; }
.pr .conf { display: grid; gap: 3px; font-weight: 600; font-size: 14px; }
.lbl { display: none; color: var(--muted); font-size: 12px; font-weight: 400; }
.neg { color: var(--bad); font-weight: 700; } .pos { color: var(--good); font-weight: 700; }
.chev { color: var(--muted); transition: transform .12s; }
.pr[aria-expanded="true"] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.detail { padding: 10px 12px 14px; background: var(--sunken); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; }
.detail .full { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 14px; }
.mix-label { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
.mix { display: flex; height: 18px; border-radius: 3px; overflow: hidden; background: var(--line); }
.mix span { background: var(--c); color: var(--bg); font: 700 13px/18px var(--display); text-align: center; min-width: 0; overflow: hidden; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

.vs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13.5px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; }
.bar-pair { display: grid; gap: 2px; position: relative; }
.bar { display: flex; align-items: center; gap: 5px; font-size: 13px; height: 16px; }
.bar i { display: block; height: 100%; min-width: 2px; border-radius: 0 2px 2px 0; }
.bar.o i { background: var(--accent); } .bar.d i { background: var(--muted); }
.avg { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--fg); }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.key i { display: inline-block; width: 11px; height: 9px; margin-right: 4px; }
.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
.mini th { text-align: right; font-weight: 400; color: var(--muted); font-size: 12.5px; padding: 2px 0 2px 8px; }
.mini td { text-align: right; padding: 3px 0 3px 8px; border-top: 1px solid var(--line); }
.mini th:first-child, .mini td:first-child { text-align: left; padding-left: 0; }
.mixes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; }
.splitbar { display: flex; height: 26px; border-radius: 4px; overflow: hidden; font: 700 15px/26px var(--display); }
.splitbar span { padding: 0 8px; white-space: nowrap; overflow: hidden; }
.splitbar .a { background: var(--accent); color: var(--accent-fg); }
.splitbar .b { background: var(--muted); color: var(--bg); text-align: right; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th { position: sticky; top: 0; background: var(--sunken); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 0; text-align: right; white-space: nowrap; }
table.data th button { all: unset; display: block; cursor: pointer; padding: 7px 9px; }
table.data th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.data th[aria-sort="ascending"] button::after { content: " ▲"; }
table.data th[aria-sort="descending"] button::after { content: " ▼"; }
table.data th.t, table.data td.t { text-align: left; }
table.data td { padding: 6px 9px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--fg) 6%, transparent); }
table.data td.strong { font: 700 17px/1 var(--display); letter-spacing: .02em; }
table.data td.extra { white-space: normal; background: var(--sunken); text-align: left; }
.targets { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.targets div { min-width: 0; }
.empty { padding: 24px; color: var(--muted); text-align: center; }

@media (max-width: 860px) {
  .pr.head { display: none; }
  .pr { grid-template-columns: 72px 1fr auto; grid-template-areas: "team who chev" "pick conf conf" "stats stats stats"; gap: 7px 10px; }
  .pr .team { grid-area: team; } .pr .who { grid-area: who; } .pr .chev { grid-area: chev; }
  .pr .pk { grid-area: pick; } .pr .conf { grid-area: conf; }
  .pr .rz, .pr .td, .pr .fst, .pr .gf { display: inline; text-align: left; font-size: 13.5px; }
  .pr .statline { grid-area: stats; display: flex; flex-wrap: wrap; gap: 3px 14px; }
  .lbl { display: inline; }
}
@media (min-width: 861px) { .pr .statline { display: contents; } }
</style>

    html += `<div class="game"><button class="pr" data-game="${esc(p.team)}">
      <span class="team">${esc(p.team)}<em>${esc(p.opp)}</em></span>

      <span class="statline">

}

/* ---- 1st TD Picks ---- */

/* ---- Matchups ---- */

function panel(r, o) {

  const t = tw[r.team] || {};
  const gpO = (fScored[r.team] || {}).GP, gpD = (fAllowed[o.team] || {}).GP;
  return `<section class="panel">

      ${D.players.filter(p => p.team === r.team && !p.unavailable).slice(0, 4).map(p => `<tr><td><b>${esc(p.player)}</b> <span class="chip ${esc(p.pos)}">${esc(p.pos)}</span> ${statusTag(p)}</td><td>${pctText(p.anyRate)}</td><td>${pctText(p.firstRate)}</td><td>${pctText(p.rzsh)}</td><td>${pctText(p.i10sh)}</td></tr>`).join("")}
    </tbody></table>
    <div class="sub">Red-zone run rate: <b>${pct(t.rzRun)}</b> (inside 10: ${pct(t.i10Run)}). ${esc(o.team)} faces ${pct(t.oppRzRun)}. NFL average 46%, inside 10 52%.</div>
  </section>`;
}

/* ---- Defenses ---- */
const OPP_KEY = Object.keys(D.allowed[0]).find(k => /^Wk\d+ Opp$/.test(k));
const DEF_COLS = [["Team", "Team", "t"], [OPP_KEY, "This week", "t"], ["GP", "GP"], ["TDs/G", "TD/G", 2], ["RB/G", "RB/G", 2], ["WR/G", "WR/G", 2], ["TE/G", "TE/G", 2], ["QB/G", "QB/G", 2],
  ["Home TDs/G", "Home TD/G", 2], ["Away TDs/G", "Away TD/G", 2], ["first", "1st TD allowed %", "p"]];

  const rows = D.allowed.map(r => ({ ...r, first: (fAllowed[r.Team] || {})["% Game 1st TD"] }));
  const { key, dir } = state.def;
  rows.sort((a, b) => (typeof a[key] === "string" ? String(a[key]).localeCompare(b[key]) : (a[key] ?? -1) - (b[key] ?? -1)) * dir);

  return `<div><h2>TDs allowed by defense</h2><p class="hint">All touchdowns each defense has allowed this season, per game, except the last column, which is how often it allowed the game's first TD. Darker cells give up more. Use this as context: in testing it added almost nothing once player role and projected team points were known. Select a team to see the players it faces this week, or sort by any column.</p></div>
  <div class="tablebox"><table class="data"><thead><tr>${DEF_COLS.map(([k, l, f]) =>
    `<th class="${f === "t" ? "t" : ""}" aria-sort="${key === k ? (dir > 0 ? "ascending" : "descending") : "none"}"><button data-defsort="${esc(k)}">${esc(l)}</button></th>`).join("")}</tr></thead>
  <tbody>${rows.map(r => {
    const cells = DEF_COLS.map(([k, , f]) => {
      if (f === "t") return `<td class="t ${k === "Team" ? "strong" : ""}">${esc(r[k])}</td>`;
      if (f === 2 || f === "p") {
        const a = heat[k] ? Math.round((r[k] || 0) / heat[k] * 42) : 0;

  }).join("")}</tbody></table></div>`;
}

/* ---- Results: recorded before kickoff, graded after the game. ---- */
const record = (rows, field) => {
  const hits = rows.filter(e => e[field] === true).length;
  return { n: rows.length, hits, rate: rows.length ? hits / rows.length : null };
};
const recordText = r => r.n ? `${r.hits} of ${r.n} (${pctText(r.rate)})` : "No results yet";

  const all = (D.results || {}).plays || [];

  if (!all.length) return intro + `<div class="empty">No plays recorded yet. They appear here before the next kickoff.</div>`;
  const plays = all.filter(e => e.isPlay && e.anyTd !== undefined && e.played);

  const firsts = field => { const rows = all.filter(e => e[field] && e.teamFirst !== undefined && e.played !== false); return { team: record(rows, "teamFirst"), game: record(rows, "gameFirst"), any: record(rows.filter(e => e.anyTd !== undefined), "anyTd") }; };
  const app = firsts("isPick"), sheet = firsts("isSheet");
  const pending = all.filter(e => (e.isPlay || e.isPick) && e.anyTd === undefined).length;
  const dnp = all.filter(e => e.isPlay && e.played === false).length;
  const weeks = [...new Set(all.map(e => e.week))].sort((a, b) => b - a);
  const shown = all.filter(e => (e.isPlay || e.isPick) && (state.resultsWeek === "All" || String(e.week) === state.resultsWeek))

      ${tiers.map(t => `<tr><td>About ${t}</td><td>${recordText(record(plays.filter(e => pctText(e.anyRate) === t), "anyTd"))}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint">${pending} plays waiting on a result. ${dnp} recorded players didn't play.</p></section>
  <section class="stack" style="gap:10px"><h3>First TD picks: app vs. your sheet</h3>
    <div class="tablebox"><table class="mini results"><thead><tr><th>Pick came from</th><th>Team's 1st TD</th><th>Game's 1st TD</th><th>Any TD</th></tr></thead><tbody>
      <tr><td>App</td><td>${recordText(app.team)}</td><td>${recordText(app.game)}</td><td>${recordText(app.any)}</td></tr>
      <tr><td>Your sheet</td><td>${recordText(sheet.team)}</td><td>${recordText(sheet.game)}</td><td>${recordText(sheet.any)}</td></tr>
    </tbody></table></div></section>
  <section class="stack" style="gap:10px"><div class="filters"><h3>Every recorded play</h3>
    <select id="results-week" aria-label="Week"><option value="All">All weeks</option>${weeks.map(w => `<option value="${w}" ${String(w) === state.resultsWeek ? "selected" : ""}>Week ${w}</option>`).join("")}</select></div>
    <div class="tablebox"><table class="data"><thead><tr><th class="t"><button>Wk</button></th><th class="t"><button>Player</button></th><th class="t"><button>Game</button></th><th><button>Any TD tier</button></th><th><button>Scored TD</button></th><th><button>Team's 1st</button></th><th><button>Game's 1st</button></th></tr></thead><tbody>
      ${shown.map(e => `<tr><td class="t">${e.week}</td><td class="t" style="font-weight:600">${esc(e.player)} <span class="chip ${esc(e.pos)}">${esc(e.pos)}</span>${e.isPick ? '<span class="flag">1st TD pick</span>' : ""}${e.played === false ? '<span class="flag bad">Didn\u2019t play</span>' : ""}</td><td class="t">${esc(e.team)} ${esc(e.opp)}</td><td>${pctText(e.anyRate)}</td><td>${e.played === false ? "–" : mark(e.anyTd)}</td><td>${e.played === false ? "–" : mark(e.teamFirst)}</td><td>${e.played === false ? "–" : mark(e.gameFirst)}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

/* ---- Log ---- */
function viewLog() {

  const tally = {}; rows.forEach(l => { if (l[posKey]) tally[l[posKey]] = (tally[l[posKey]] || 0) + 1; });
  const mix = Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([p, n]) => `${p} ${n}`).join(" · ");
  return `<div><h2>First TD log</h2><p class="hint">Only the first touchdown for each team in each game, not every TD. One row per team per game, Weeks ${weeks[0]} to ${weeks[weeks.length - 1]}. Switch between the first TD a team scored and the first it allowed.</p></div>
  <div class="filters">${seg("logside", ["Scored", "Allowed"], s.side === "team" ? "Scored" : "Allowed")}
    <select id="log-team" aria-label="Team"><option>All</option>${teams.map(t => `<option ${t === s.team ? "selected" : ""}>${t}</option>`).join("")}</select>
    <select id="log-week" aria-label="Week"><option value="All">All weeks</option>${weeks.map(w => `<option value="${w}" ${String(w) === String(s.week) ? "selected" : ""}>Week ${w}</option>`).join("")}</select>
    ${seg("logpos", ["All", ...POS, "DEF/ST"], s.pos)}<span class="count">${rows.length} games</span></div>
  ${rows.length ? `<div style="max-width:520px">${mixBar("Position mix for this selection", mix)}</div>` : ""}
  <div class="tablebox">${rows.length ? `<table class="data"><thead><tr><th class="t"><button>Wk</button></th><th class="t"><button>Team</button></th><th class="t"><button>Opp</button></th><th class="t"><button>Site</button></th><th class="t"><button>${s.side === "team" ? "Scorer" : "Scored by opponent"}</button></th><th class="t"><button>Pos</button></th><th class="t"><button>How</button></th><th><button>Game's 1st?</button></th></tr></thead><tbody>
    ${rows.map(l => { const p = l[posKey]; const howKey = s.side === "team" ? "How" : "Allowed How";
      const gameFirst = l["Game 1st TD Scorer"] && l["Game 1st TD Scorer"] === l[nameKey];
      return `<tr><td class="t">${l.Week}</td><td class="t strong">${esc(l.Team)}</td><td class="t">${esc(l.Opp)}</td><td class="t">${esc(l["Home/Away"])}</td><td class="t" style="font-weight:600">${esc(l[nameKey]) || "No TD"}</td><td class="t">${p ? `<span class="chip ${p === "DEF/ST" ? "DST" : esc(p)}">${esc(p)}</span>` : ""}</td><td class="t">${esc(l[howKey])}</td><td>${gameFirst ? "Yes" : ""}</td></tr>`; }).join("")}
  </tbody></table>` : `<div class="empty">No games match these filters.</div>`}</div>`;
}

function render() {
  renderTabs();
  $("#view").innerHTML = { results: viewResults, plays: viewPlays, picks: viewPicks, matchups: viewMatchups, defenses: viewDefenses, players: viewPlayers, log: viewLog }[state.tab]();
  if (state.tab === "players") fillPlayers();
}

$("#view").addEventListener("click", e => {
  const b = e.target.closest("button, tr[data-defopen]"); if (!b) return;
  const d = b.dataset;
  if (d.game) return go("matchups", { game: d.game });
  if (d.open) { state.open = state.open === d.open ? null : d.open; return render(); }
  if ("playstarted" in d) { state.plays.started = !state.plays.started; return render(); }
  if (d.seg) {
    const v = d.val;
    if (d.seg === "day") state.day = v; else if (d.seg === "pos") state.pos = v;
    else if (d.seg === "playpos") state.plays.pos = v; else if (d.seg === "playday") state.plays.day = v;
    else if (d.seg === "plypos") state.ply.pos = v; else if (d.seg === "logpos") state.log.pos = v;
    else if (d.seg === "logside") state.log.side = v === "Scored" ? "team" : "allowed";
    return render();
  }
  if (d.defsort) { const s = state.def; if (s.key === d.defsort) s.dir *= -1; else { s.key = d.defsort; s.dir = -1; } return render(); }
  if (d.defopen) { state.def.open = state.def.open === d.defopen ? null : d.defopen; return render(); }
  if (d.plysort) { const s = state.ply; if (s.key === d.plysort) s.dir *= -1; else { s.key = d.plysort; s.dir = -1; } return fillPlayers(); }
});
$("#view").addEventListener("keydown", e => {
  const tr = e.target.closest && e.target.closest("tr[data-defopen]");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); }
});
$("#view").addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "game-pick") { state.game = v; render(); }
  if (id === "ply-team") { state.ply.team = v; fillPlayers(); }
  if (id === "log-team") { state.log.team = v; render(); }
  if (id === "log-week") { state.log.week = v; render(); }
  if (id === "results-week") { state.resultsWeek = v; render(); }
});
$("#view").addEventListener("input", e => { if (e.target.id === "ply-q") { state.ply.q = e.target.value; fillPlayers(); } });

/* ---- Update from the sheet. Keep this parser in step with build.py. ---- */
const EXPORT_URL = "https://docs.google.com/spreadsheets/d/1fwtkoY2KveC6TJPRyn0pvHPseVw2_4j2Qbud1x0q1pU/export?format=xlsx";
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = XLSX_URL; s.onload = ok; s.onerror = () => fail(new Error("Couldn't load the spreadsheet reader."));
    document.head.append(s);
  });
}
function parseWorkbook(buffer) {
  const wb = XLSX.read(buffer, { type: "array" });
  const clean = v => typeof v === "number" ? (Number.isInteger(v) ? v : Math.round(v * 1000) / 1000)
    : typeof v === "string" ? v.trim() : v ?? null;
  const rawRows = name => {
    if (!wb.Sheets[name]) throw new Error(`The sheet has no "${name}" tab.`);
    return XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
  };
  const rows = name => rawRows(name).map(r => r.map(clean));
  const zip = (keys, vals) => Object.fromEntries(keys.map((k, i) => [k, vals[i] ?? null]).filter(([k]) => k));
  const table = name => {
    const [head, ...rest] = rows(name);
    return rest.filter(r => r[0] !== null && r[0] !== "").map(r => zip(head, r));
  };
  const headerAt = (all, first) => all.findIndex(r => r[0] === first);
  const timeText = v => {
    if (typeof v !== "number") return v;
    const m = Math.round(v * 1440), h = Math.floor(m / 60);
    return `${h % 12 || 12}:${String(m % 60).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
  };

  const picks = rows("1st TD Picks");
  const topAt = headerAt(picks, "#"), top = [];
  for (const r of picks.slice(topAt + 1)) { if (!Number.isInteger(r[0])) break; top.push(zip(picks[topAt], r)); }
  const slateKeys = ["day", "kick", "team", "opp", "teamPos", "venuePos", "oppPos", "oppVenue", "pick", "conf", "player", "rz", "tds", "first", "alt", "gameFirst", "noTd"];
  const slate = []; let day = null, kick = null;
  for (const r of picks.slice(headerAt(picks, "Day") + 1)) {
    if (!r[2]) continue;
    day = r[0] || day; kick = r[1] || kick;
    slate.push(zip(slateKeys, [day, kick, ...r.slice(2)]));
  }
  const weekMatch = /WEEK (\d+)/.exec(picks[0][0] || "");
  if (!weekMatch) throw new Error("The 1st TD Picks tab has no week in its title.");

  const off = {}, dfn = {}, nickToAbbr = {}; let refreshed = "";
  const add = (bucket, team, pos, ru, re, pa) => {
    const t = (bucket[team] ??= {})[pos] ??= [0, 0, 0];
    t[0] += ru; t[1] += re; t[2] += pa;
  };
  for (const r of rows("POS DATA")) {
    for (const c of r) if (typeof c === "string" && c.startsWith("Last refreshed")) refreshed = c.replace("Last refreshed:", "").trim();
    if (r[9] && r[9] !== "Nick" && r[11]) nickToAbbr[r[9]] = r[11];
    if (POS.includes(r[0])) { add(off, r[1], r[0], r[5] || 0, r[6] || 0, r[4] || 0); add(dfn, r[2], r[0], r[5] || 0, r[6] || 0, r[4] || 0); }
  }

  const weekRows = rawRows("This Weeks TDs").map(r => r.map((v, i) => i === 1 ? timeText(v) : clean(v)));
  const twKeys = ["slot", "kick", "team", "opp", "pick", "lean", "teamTd", "oppTd", "top", "share", "rzShare", "i10Share", "second", "secondShare", "rzRun", "i10Run", "oppRzRun"];
  const thisWeek = []; let slot = null, twKick = null;
  for (const r of weekRows.slice(headerAt(weekRows, "Slot") + 1)) {
    if (!r[2]) continue;
    slot = r[0] || slot; twKick = r[1] || twKick;
    const rec = zip(twKeys, [slot, twKick, ...r.slice(2)]);
    rec.abbr = nickToAbbr[rec.team] || rec.team;
    thisWeek.push(rec);
  }

  const nflAvg = {};
  for (const r of rows("Matchup TDs")) {
    const vals = r.filter(v => v !== null);
    if (POS.includes(vals[0]) && !(vals[0] in nflAvg)) nflAvg[vals[0]] = vals[vals.length - 1];
  }
  const [usageHead, ...usageRows] = rows("USAGE DATA");
  const usageKeys = usageHead.slice(0, 18);
  const data = { week: +weekMatch[1], note: picks[1][0], refreshed, top, slate, thisWeek,
    allowed: table("TDs Allowed by Pos"), firstScored: table("1st TD Scored"), firstAllowed: table("1st TD Allowed"), log: table("1st TD Log"),
    usage: usageRows.filter(r => r[1]).map(r => zip(usageKeys, r)), off, dfn, nflAvg,
    nicks: Object.fromEntries(Object.entries(nickToAbbr).map(([k, v]) => [v, k])) };

  const bad = slate.length < 2 || slate.length > 32 || slate.length % 2 || !top.length || data.allowed.length !== 32
    || !data.usage.length || !data.log.length || !Object.keys(off).length
    || slate.some(r => !r.pick || !r.player || !String(r.conf).includes("%"));
  if (bad) throw new Error("The sheet looks incomplete right now, so nothing was changed.");
  return data;
}
window.parseWorkbook = parseWorkbook; window.parseLines = parseLines;
const signature = d => JSON.stringify([d.week, d.refreshed, d.log.length, d.slate.map(r => [r.team, r.pick, r.sheetPlayer || r.player, r.conf, r.sheetGameFirst || r.gameFirst]),
  d.allowed.map(r => [r.Team, r["TDs Allowed"]]), d.usage.map(r => [r.player, r.targets, r.carries]), Object.entries(d.injuries || {}).sort(), Object.entries(d.lines || {}).map(([k, v]) => [k, v.imp, v.total, v.final]).sort()]);
function parseLines(text, week) { // Keep in step with game_lines in build.py.
  const wb = XLSX.read(text, { type: "string", raw: true }), out = {};
  for (const g of XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" })) {
    if (String(g.season) !== "2026" || String(g.week) !== String(week) || g.spread_line === "" || g.total_line === "") continue;
    const spread = +g.spread_line, total = +g.total_line;
    const info = { total, kickoff: `${g.gameday}T${g.gametime}:00-05:00`, final: g.result !== "" };
    out[g.home_team] = { ...info, margin: spread, imp: (total + spread) / 2 };
    out[g.away_team] = { ...info, margin: -spread, imp: (total - spread) / 2 };
  }
  return out;
}
function parseInjuries(json) { // Keep in step with injuries in build.py.
  const latest = {};
  for (const team of json.injuries || []) {
    const abbr = Object.keys(D.nicks).find(a => (team.displayName || "").endsWith(D.nicks[a]));
    for (const item of team.injuries || []) {
      const key = `${abbr}|${normName(item.athlete.displayName)}`;
      if (!latest[key] || (item.date || "") > latest[key][0]) latest[key] = [item.date || "", item.status];
    }
  }
  return Object.fromEntries(Object.entries(latest).filter(([, v]) => ["Active", "Out", "Doubtful", "Questionable", "Injured Reserve", "Suspension"].includes(v[1])).map(([k, v]) => [k, v[1]]));
}
$("#update-btn").onclick = async () => {
  const btn = $("#update-btn"), status = $("#update-status");
  btn.disabled = true; status.textContent = "Updating…";
  try {
    await loadXlsx();
    const resp = await fetch(EXPORT_URL);
    if (!resp.ok) throw new Error("Couldn't reach the sheet. Check that it's still shared by link, then try again.");
    const fresh = parseWorkbook(await resp.arrayBuffer());
    fresh.recent = D.recent; fresh.model = D.model; fresh.lines = D.lines; fresh.injuries = D.injuries; fresh.injuriesAt = D.injuriesAt;
    try {
      const inj = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries");
      if (inj.ok) { fresh.injuries = parseInjuries(await inj.json()); fresh.injuriesAt = new Date().toISOString(); }
    } catch (e) { /* Keep the last injury report if ESPN is down. */ }
    try {
      const lines = await fetch("https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv");
      if (lines.ok) { const parsed = parseLines(await lines.text(), fresh.week); if (Object.keys(parsed).length) fresh.lines = parsed; }
    } catch (e) { /* Keep the last lines if the source is down. */ }
    if (signature(fresh) === signature(D)) { status.textContent = `Already current: Week ${D.week}`; return; }
    localStorage.setItem(SAVED_KEY, JSON.stringify(fresh));
    location.hash = state.tab;
    location.reload();
  } catch (e) {
    status.textContent = e.name === "TypeError" ? "Couldn't reach the sheet. Check your connection and try again."
      : e.name === "QuotaExceededError" || e.name === "SecurityError" ? "This browser won't save the update. Turn off private browsing and try again."
      : e.message;
  } finally { btn.disabled = false; }
};

$("#stamp").textContent =`2026 season · Week ${D.week} · sheet data refreshed ${D.refreshed.split(",")[0]} · kickoffs in Central Time`;
const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) state.tab = h;
render();
</script>
